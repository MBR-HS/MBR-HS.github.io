<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔞 私人专属 · 深夜诱惑 🔞</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(128, 0, 255, 0.3) 0%, transparent 45%),
                        radial-gradient(circle at 40% 80%, rgba(0, 200, 255, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 70% 20%, rgba(255, 100, 0, 0.2) 0%, transparent 40%);
            animation: bgPulse 6s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp 10s infinite linear;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 0, 150, 0.5);
            border-radius: 28px;
            padding: 35px 40px 40px;
            width: 90%;
            max-width: 620px;
            box-shadow: 0 0 60px rgba(255, 0, 150, 0.4),
                        0 0 120px rgba(128, 0, 255, 0.2),
                        inset 0 0 40px rgba(255, 0, 150, 0.1);
            text-align: center;
            animation: cardGlow 3s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 0 50px rgba(255, 0, 150, 0.3), 0 0 100px rgba(128, 0, 255, 0.15); border-color: rgba(255, 0, 150, 0.4); }
            100% { box-shadow: 0 0 80px rgba(255, 0, 150, 0.6), 0 0 160px rgba(128, 0, 255, 0.35); border-color: rgba(255, 50, 200, 0.8); }
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff4d94, #cc33ff, #ff66b2, #ff3399);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 150, 0.7);
            margin-bottom: 8px;
            animation: titleShake 0.5s ease-in-out infinite alternate;
        }

        @keyframes titleShake {
            0% { transform: rotate(-1deg) scale(1); }
            100% { transform: rotate(1deg) scale(1.02); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: rgba(255, 180, 220, 0.9);
            letter-spacing: 6px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 150, 0.6);
        }

        .fake-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            border: 2px solid rgba(255, 0, 150, 0.5);
            box-shadow: 0 0 40px rgba(255, 0, 150, 0.3), inset 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .fake-player::after {
            content: '▶';
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.15);
            position: absolute;
            animation: pulsePlay 1.5s infinite;
        }

        @keyframes pulsePlay {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        .fake-player-text {
            position: relative;
            z-index: 2;
            color: rgba(255, 200, 230, 0.5);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255,0,150,0.5);
            animation: blink 1.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .btn-group {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff1a8c, #cc00cc);
            color: white;
            box-shadow: 0 0 30px rgba(255, 26, 140, 0.7);
            animation: btnPulse 1.8s infinite;
        }

        @keyframes btnPulse {
            0% { box-shadow: 0 0 20px rgba(255, 26, 140, 0.5); }
            50% { box-shadow: 0 0 50px rgba(255, 26, 140, 1), 0 0 80px rgba(200, 0, 200, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 26, 140, 0.5); }
        }

        .btn-primary:hover {
            transform: scale(1.07);
            background: linear-gradient(135deg, #ff3399, #dd00dd);
        }

        .btn-secondary {
            background: transparent;
            color: #ff99cc;
            border: 2px solid rgba(255, 0, 150, 0.6);
            box-shadow: 0 0 20px rgba(255, 0, 150, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 150, 0.15);
            border-color: #ff4d94;
            color: #fff;
            box-shadow: 0 0 40px rgba(255, 0, 150, 0.5);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: rgba(255, 200, 230, 0.35);
            letter-spacing: 1px;
        }

        .video-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .marquee {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 0, 100, 0.15);
            border-bottom: 1px solid rgba(255, 0, 150, 0.5);
            padding: 8px 0;
            overflow: hidden;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .marquee span {
            display: inline-block;
            white-space: nowrap;
            animation: scrollLeft 12s linear infinite;
            color: #ff66b2;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 0, 150, 0.8);
            font-weight: 600;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        @media (max-width: 600px) {
            .card { padding: 25px 18px 30px; }
            .title { font-size: 1.8rem; letter-spacing: 2px; }
            .subtitle { font-size: 0.85rem; letter-spacing: 3px; }
            .btn { padding: 12px 25px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="marquee">
        <span>🔥 深夜激情 · 真人实拍 · 点击即看 🔥 未成年禁止入内 🔥 高清无码 · 蒋介石巨献 🔥</span>
    </div>

    <div class="card">
        <div class="title">🔞 老 蒋 禁 区 🔞</div>
        <div class="subtitle">N A I L O N G · 1 8 +</div>

        <div class="fake-player" id="fakePlayer">
            <div class="fake-player-text" id="playerText">正在加载超清资源...</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="playBtn">立即播放</button>
            <button class="btn btn-secondary" id="vipBtn">开通VIP</button>
        </div>

        <div class="footer-note">
            ⚡ 已有 1145,14,1919,810 人正在观看 ⚡
        </div>
    </div>

    <!-- 全屏遮罩层：video 由 JS 动态创建，不在首页加载 -->
    <div class="video-overlay" id="videoOverlay"></div>

    <script>
        (function() {
            // ===== 视频源配置（按顺序尝试）=====
            var VIDEO_SOURCES = [
                // 1. 本地文件（最稳，放到同目录改名 nailong.mp4）
                './nailong.mp4',
                // 2. jsDelivr CDN（国内快，MIME 规范）
                'https://cdn.jsdelivr.net/gh/MBR-HS/0x7c00.mbr@main/ezyZip.mp4',
                // 3. GitHub raw 兜底（国内可能很慢或被墙）
                'https://raw.githubusercontent.com/MBR-HS/0x7c00.mbr/refs/heads/main/ezyZip.mp4'
            ];

            var overlay      = document.getElementById('videoOverlay');
            var fakePlayer   = document.getElementById('fakePlayer');
            var playerText   = document.getElementById('playerText');
            var playBtn      = document.getElementById('playBtn');
            var vipBtn       = document.getElementById('vipBtn');

            // 预先创建隐藏的 video 元素（先不加载）
            var preloadVideo = document.createElement('video');
            preloadVideo.muted = true;
            preloadVideo.loop = true;
            preloadVideo.playsInline = true;
            preloadVideo.preload = 'auto';
            preloadVideo.volume = 1.0;
            preloadVideo.style.position = 'fixed';
            preloadVideo.style.width = '1px';
            preloadVideo.style.height = '1px';
            preloadVideo.style.opacity = '0.01';
            preloadVideo.style.pointerEvents = 'none';
            preloadVideo.style.zIndex = '-999';
            document.body.appendChild(preloadVideo);

            // 全屏用的 video
            var fullVideo = document.createElement('video');
            fullVideo.muted = true;
            fullVideo.loop = true;
            fullVideo.playsInline = true;
            fullVideo.controls = true;
            fullVideo.preload = 'auto';
            fullVideo.volume = 1.0;
            overlay.appendChild(fullVideo);

            var videoReady = false;
            var preloadStarted = false;

            // ===== 渐进式加载：首屏稳定后再悄悄加载视频 =====
            function startPreload() {
                if (preloadStarted) return;
                preloadStarted = true;

                var idx = 0;

                function tryNextSource() {
                    if (idx >= VIDEO_SOURCES.length) {
                        playerText.textContent = '资源加载失败，请检查网络';
                        return;
                    }
                    var src = VIDEO_SOURCES[idx];

                    preloadVideo.src = src;

                    var timer = setTimeout(function() {
                        if (!videoReady) {
                            console.warn('源超时，尝试下一个:', src);
                            idx++;
                            tryNextSource();
                        }
                    }, 8000);

                    preloadVideo.onloadeddata = function() {
                        clearTimeout(timer);
                        videoReady = true;
                        playerText.textContent = '资源已就绪 · 点击播放';
                        preloadVideo.play().catch(function() {});
                        fullVideo.src = src;
                        fullVideo.load();
                        console.log('视频源可用:', src);
                    };

                    preloadVideo.onerror = function() {
                        clearTimeout(timer);
                        console.warn('源加载失败:', src);
                        idx++;
                        tryNextSource();
                    };

                    preloadVideo.load();
                }

                tryNextSource();
            }

            if ('requestIdleCallback' in window) {
                requestIdleCallback(startPreload, { timeout: 2000 });
            } else {
                window.addEventListener('load', function() {
                    setTimeout(startPreload, 500);
                });
            }
            setTimeout(startPreload, 1500);

            // ===== 用户第一次交互解锁声音 =====
            function unlockSound() {
                preloadVideo.muted = false;
                fullVideo.muted = false;
                fullVideo.volume = 1.0;
                preloadVideo.volume = 1.0;
                document.removeEventListener('click', unlockSound);
                document.removeEventListener('touchstart', unlockSound);
            }
            document.addEventListener('click', unlockSound);
            document.addEventListener('touchstart', unlockSound);

            // ===== 全屏播放 =====
            function showFullscreen() {
                overlay.style.display = 'flex';
                fullVideo.muted = false;
                fullVideo.volume = 1.0;
                if (videoReady && preloadVideo.currentTime > 0) {
                    try { fullVideo.currentTime = preloadVideo.currentTime; } catch(e) {}
                }
                fullVideo.play().catch(function() {
                    fullVideo.muted = true;
                    fullVideo.play().catch(function() {});
                });
                preloadVideo.muted = true;

                if (overlay.requestFullscreen) overlay.requestFullscreen().catch(function(){});
                else if (overlay.webkitRequestFullscreen) overlay.webkitRequestFullscreen();
                else if (overlay.msRequestFullscreen) overlay.msRequestFullscreen();
            }

            function closeOverlay() {
                overlay.style.display = 'none';
                fullVideo.pause();
                preloadVideo.muted = false;
                preloadVideo.play().catch(function(){});
                if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
                else if (document.webkitFullscreenElement) document.webkitExitFullscreen();
            }

            fakePlayer.addEventListener('click', showFullscreen);
            playBtn.addEventListener('click', function(e) { e.stopPropagation(); showFullscreen(); });
            vipBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                alert('🎉 恭喜您获得蒋介石终身VIP！\n\n即将为您播放蒋介石与希特勒独家正太扭腰视频！');
                showFullscreen();
            });

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeOverlay();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && overlay.style.display === 'flex') closeOverlay();
            });

            document.addEventListener('fullscreenchange', function() {
                if (!document.fullscreenElement && overlay.style.display === 'flex') {
                    overlay.style.display = 'none';
                    fullVideo.pause();
                    preloadVideo.muted = false;
                    preloadVideo.play().catch(function(){});
                }
            });

            // ===== 漂浮粒子 =====
            var colors = [
                'rgba(255, 20, 147, 0.7)',
                'rgba(200, 0, 255, 0.6)',
                'rgba(0, 200, 255, 0.5)',
                'rgba(255, 100, 200, 0.8)'
            ];
            for (var i = 0; i < 35; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                var size = Math.random() * 6 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = Math.random() * 12 + 's';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + p.style.background;
                document.body.appendChild(p);
            }

            console.log('🔞 页面已加载，视频将在后台悄悄预加载');
        })();
    </script>
</body>
</html>
